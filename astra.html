<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRA</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--tx:#1b1b20;--mu:#6c6c78;--ln:#e2dfd9;--ac:#7a52ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e13;--card:#1a1a22;--tx:#f0eff5;--mu:#9b9aa9;--ln:#2d2d3a}}
:root[data-theme="dark"]{--bg:#0e0e13;--card:#1a1a22;--tx:#f0eff5;--mu:#9b9aa9;--ln:#2d2d3a}
:root[data-g="male"]{--ac:#2f7bff}:root[data-g="female"]{--ac:#e8499f}
*{box-sizing:border-box}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:18px;letter-spacing:.2em}
header small{letter-spacing:0;font-size:12px;color:#fff;background:var(--ac);padding:3px 10px;border-radius:99px}
main{max-width:640px;margin:0 auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.l{display:block;font-weight:600;margin:14px 0 6px}.mu{color:var(--mu);font-size:13px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
input[type=range]{padding:0}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;min-width:74px;border:2px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
.opt.on{border-color:var(--ac);color:var(--ac)}.opt:disabled{opacity:.5}
.opt i{width:26px;height:26px;border-radius:50%;display:block;border:1px solid var(--ln)}
.opt small{color:var(--mu);font-size:10px;text-align:center;max-width:90px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:16px;width:100%}
.btn.s{width:auto;margin:0;padding:10px 16px}.row{display:flex;gap:8px;margin-top:8px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--mu);font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ln)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border:0}.kv span:first-child{color:var(--mu)}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;border:1px solid var(--ln)}
.code{font-size:30px;letter-spacing:.25em;font-weight:700;color:var(--ac);text-align:center;margin:6px 0}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--bg);word-wrap:break-word}.bub.me{margin-left:auto;background:var(--ac);color:#fff}
.fr{display:block;width:100%;text-align:left;padding:10px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;cursor:pointer}.fr.on{color:var(--ac);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;cursor:pointer}nav button.on{color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;max-width:90%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes glint{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes flow{to{background-position:200% 0}}
@keyframes drift{to{transform:translate(-3%,3%) scale(1.1)}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 20% 10%,color-mix(in srgb,var(--ac) 24%,transparent),transparent),radial-gradient(35% 30% at 85% 90%,color-mix(in srgb,#ff4fd8 15%,transparent),transparent);animation:drift 14s ease-in-out infinite alternate}
main>*{animation:rise .45s ease both}.bub{animation:rise .25s ease both}
.opt{transition:transform .2s,border-color .2s,box-shadow .2s}.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent);animation:pop .35s}
.opt:hover .ir{animation:look 1.4s ease-in-out infinite}.hr{transform-origin:50% 0;transform-box:fill-box}
.opt:hover .hr{animation:sway 1.1s ease-in-out infinite}.opt:hover .gl,.opt.on .gl{animation:glint 1.2s ease-in-out infinite}
.opt i{box-shadow:inset -3px -4px 6px #0005,inset 3px 3px 5px #fff4;transition:transform .2s}.opt:hover i{transform:scale(1.2)}
.btn{transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.tabs button{transition:background .25s,color .25s}
.code{background:linear-gradient(90deg,var(--ac),#ff7ad9,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 4s linear infinite}
@media (prefers-reduced-motion:reduce){*,body::before{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><span>ASTRA</span><small id="area"></small></header>
<main id="v"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const E=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>{if(x!=null)e.append(x)});return e};
const H=h=>{const d=document.createElement('span');d.innerHTML=h;return d};
const LS={g:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={db:null,uid:null,p:null,fr:[],m:{in:[],out:[]},view:'home',tab:'body',chat:null,F:{},ready:0};
const note=t=>{const n=$('#toast');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',3500)};
let _u=0;
function eyeSvg(o={}){const{tilt=3,ht=17,hb=13,cx=22,gap=7,bd=9,deep=0,prot=0,crz='par',scl=0,fold=0,g=''}=o;
 const id='k'+(++_u),ix=12,ox=88,iy=34,oy=iy-tilt,my=(iy+oy)/2,ir=9+prot*2,top=my-.75*ht,icy=my+.75*hb-ir+1-(scl?6:0),by=top-gap-bd,
 lid=`M${ix} ${iy}C${ix+cx} ${iy-ht} ${ox-cx} ${oy-ht} ${ox} ${oy}C${ox-cx} ${oy+hb} ${ix+cx} ${iy+hb} ${ix} ${iy}Z`,
 cr=crz==='none'?'':`<path d="M${crz==='tap'?`${ix+1} ${iy-1}`:`${ix+5} ${iy-gap-2}`}C${ix+cx} ${iy-ht-gap} ${ox-cx} ${oy-ht-gap} ${ox-3} ${oy-gap}" opacity=".85"/>`,
 gd=g==='tilt'?`<path d="M${ix} ${iy}H${ox+6}" stroke-dasharray="3 3" stroke-width="1.2" opacity=".6"/><path d="M${ix} ${iy}L${ox+6} ${iy-tilt*(ox+6-ix)/(ox-ix)}" stroke="var(--ac)" stroke-width="2.5"/>`:g==='uee'?`<path d="M50 ${top}V${top-.75*gap}M45 ${top}H55M45 ${top-.75*gap}H55" stroke="var(--ac)" stroke-width="2"/>`:'';
 return `<svg viewBox="0 -4 100 58" width="92" height="53" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><defs><clipPath id="${id}"><path d="${lid}"/></clipPath></defs>${deep?`<ellipse cx="50" cy="${my-4}" rx="46" ry="24" fill="currentColor" opacity=".12" stroke="none"/>`:''}<path d="${lid}" fill="#f1f1f1"/><g clip-path="url(#${id})" stroke="none"><g class="ir"><circle cx="50" cy="${icy}" r="${ir}" fill="#6b3e1f"/><circle cx="50" cy="${icy}" r="${ir*.42}" fill="#111"/><circle cx="${50+ir*.3}" cy="${icy-ir*.3}" r="1.6" fill="#fff"/></g></g><path d="${lid}"/>${cr}${fold?`<path d="M${ox-40} ${oy-ht*.75-gap}Q${ox-16} ${oy-ht*.6-1} ${ox+2} ${oy+1}" stroke-width="3"/>`:''}<path d="M${ix-2} ${by+4}Q50 ${by-4} ${ox+4} ${by+3}" stroke-width="4" opacity=".7"/>${gd}</svg>`}
const EYE_SHAPE={Almond:{},Round:{ht:21,hb:19,cx:14,tilt:0},Upturned:{tilt:9},Downturned:{tilt:-8},Hooded:{ht:12,hb:12,gap:1.5,fold:1,tilt:2},Monolid:{ht:11,hb:11,crz:'none',tilt:2}};
const EYE_DEPTH={'Deep-set':{deep:1,gap:3,bd:2,ht:13,hb:11,tilt:2},Average:{},Protruding:{prot:1,ht:23,hb:20,cx:15,scl:1,tilt:0}};
const EYE_TILT={Positive:{tilt:9,g:'tilt'},Neutral:{tilt:0,g:'tilt'},Negative:{tilt:-9,g:'tilt'}};
const EYE_UEE={High:{gap:12,bd:6,g:'uee'},Low:{gap:3,ht:14,g:'uee'}};
const ep=(k,m)=>pick(k,Object.keys(m),v=>[H(eyeSvg(m[v])),v,CAPS[k]?.[v]?E('small',{},CAPS[k][v]):null]);
const CAPS={eyeD:{'Deep-set':'brow shadows the eye',Protruding:'eyeball sits forward'},eyeT:{Positive:'outer corner higher',Neutral:'level',Negative:'outer corner lower'},eyeU:{High:'lots of lid shows',Low:'little lid shows'}};
const HEADS={Oval:'<ellipse cx="30" cy="35" rx="19" ry="27"/>',Round:'<circle cx="30" cy="36" r="24"/>',Square:'<path d="M10 12Q10 7 16 7H44Q50 7 50 12V48L42 60Q30 66 18 60L10 48Z"/>',Heart:'<path d="M9 18Q9 6 30 7Q51 6 51 18Q51 38 30 64Q9 38 9 18Z"/>',Oblong:'<ellipse cx="30" cy="35" rx="16" ry="31"/>'};
const headSvg=k=>`<svg viewBox="0 0 60 70" width="54" height="63" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="currentColor" fill-opacity=".07">${HEADS[k]}</g><g class="ir"><path d="M20 30h6M34 30h6"/></g><path d="M30 33v8l-3 1M25 50q5 3 10 0" opacity=".7"/></svg>`;
const HAIR={Straight:'M0 6V54',Wavy:'M0 6q6 6 0 12t0 12t0 12t0 12',Curly:'M0 6c9 0 9 9 0 9s-9 9 0 9 9 9 0 9 -9 9 0 9',Coily:'M0 6l6 4-12 4 12 4-12 4 12 4-12 4 12 4-12 4'};
const hairSvg=k=>`<svg viewBox="0 0 60 60" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><g class="hr">${[12,21,30,39,48].map(x=>`<path transform="translate(${x} 0)" d="${HAIR[k]}"/>`).join('')}</g></svg>`;
const SKIN={Normal:'Balanced, few blemishes',Oily:'Shiny by midday, visible pores',Dry:'Tight, flaky, rough patches',Combination:'Oily T-zone, dry cheeks',Sensitive:'Redness, stings or burns easily'};
const SKFX={Normal:'<path d="M20 18q6-5 14-3" class="gl"/>',Oily:'<path d="M20 16q7-6 16-2M24 24l4-3M32 40l4-2" class="gl"/><circle cx="30" cy="38" r="1.6" fill="currentColor" class="gl" stroke="none"/>',Dry:'<path d="M18 36l5 3M36 22l6 2M24 44l4-5M40 38l3 4" opacity=".8"/>',Combination:'<path d="M30 12V46" class="gl" stroke-width="3"/><path d="M15 36l4 3M41 34l4 3" opacity=".8"/>',Sensitive:'<g fill="#e0556a" stroke="none" class="gl"><circle cx="19" cy="34" r="3.5"/><circle cx="41" cy="34" r="3.5"/><circle cx="25" cy="42" r="2.4"/><circle cx="35" cy="20" r="2.2"/></g>'};
const skinSvg=k=>`<svg viewBox="0 0 60 60" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="30" cy="30" r="24" fill="currentColor" fill-opacity=".07"${k==='Dry'?' stroke-dasharray="4 3"':''}/>${SKFX[k]}</svg>`;
const EYEC={Brown:'#6b3e1f',Hazel:'#8a6a2a',Green:'#4f8a4b',Blue:'#4a7fc1',Gray:'#8b95a1',Amber:'#c58a1b'};
const HAIRC={Black:'#151515','Dark brown':'#3b2417',Brown:'#6a4328',Blonde:'#d9b86a',Red:'#a8421f','Gray/White':'#cfcfd4',Other:'#9a63c9'};
const RACES=['Asian','Black / African descent','Hispanic / Latino','Middle Eastern / North African','Native / Indigenous','Pacific Islander','South Asian','White / European','Mixed','Other','Prefer not to say'];
const STOPS=['#f8dccb','#ecbf9f','#cf9467','#966038','#573520','#33200f'];
const hexAt=v=>{const x=v/100*(STOPS.length-1),i=Math.min(Math.floor(x),STOPS.length-2),t=x-i,a=STOPS[i],b=STOPS[i+1];const c=n=>Math.round(parseInt(a.slice(n,n+2),16)*(1-t)+parseInt(b.slice(n,n+2),16)*t).toString(16).padStart(2,'0');return '#'+c(1)+c(3)+c(5)};
const genCode=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');

function pick(key,items,mk,lock){const w=E('div',{class:'grid'});const set=()=>[...w.children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.F[key]));
 items.forEach(v=>w.append(E('button',{type:'button','data-v':v,class:'opt',onclick:()=>{S.F[key]=v;set()}},...mk(v))));
 if(lock)[...w.children].forEach(b=>b.disabled=true);set();return w}

function form(edit){
 S.F={...(S.p||{})};const F=S.F;const err=E('p',{class:'mu'});
 const inp=(k,t,ph,x={})=>{const i=E('input',{type:t,placeholder:ph,...x});i.value=F[k]??'';i.oninput=()=>F[k]=t==='number'?(i.value===''?'':+i.value):i.value;return i};
 const L=t=>E('label',{class:'l'},t);
 const sel=E('select',{onchange:e=>F.race=e.target.value},E('option',{value:''},'Select…'),RACES.map(r=>E('option',{value:r},r)));sel.value=F.race||'';
 const prev=E('span',{class:'sw'});const sk=E('input',{type:'range',min:0,max:100});sk.value=F.skin??40;
 const upd=()=>{F.skin=+sk.value;prev.style.background=hexAt(F.skin)};sk.oninput=upd;upd();
 sk.style.background='linear-gradient(90deg,'+STOPS.join(',')+')';sk.style.height='14px';
 const go=E('button',{class:'btn',onclick:async()=>{
  if(!F.nick||!(F.age>=13)||!F.gender){err.textContent='Add a nickname, an age (13+) and choose male or female.';return}
  F.skinHex=hexAt(F.skin??40);F.code=F.code||genCode();await saveProfile({...F});S.view='home';render()}},edit?'Save changes':'Save & enter');
 return E('div',{},E('h2',{},edit?'Edit details':'Tell us about you'),E('p',{class:'mu'},'This sets up your personal dashboard. Gender decides which area you enter and can’t be changed later.'),
  E('div',{class:'card'},L('Nickname'),inp('nick','text','Nickname',{maxlength:20}),L('Age'),inp('age','number','Age',{min:13,max:99}),
   L('Gender'),pick('gender',['male','female'],v=>[v[0].toUpperCase()+v.slice(1)],edit),
   L('Height (cm)'),inp('height','number','e.g. 178'),L('Weight (kg)'),inp('weight','number','e.g. 72'),L('Shoe size (EU)'),inp('shoe','number','e.g. 43',{step:.5}),L('Race / ethnicity'),sel),
  E('div',{class:'card'},E('b',{},'Face & features'),L('Skin color'),E('div',{class:'row'},prev,sk),
   L('Eye color'),pick('eyeC',Object.keys(EYEC),v=>[E('i',{style:'background:'+EYEC[v]}),v]),
   L('Eye shape'),ep('eyeS',EYE_SHAPE),L('Eye depth'),ep('eyeD',EYE_DEPTH),L('Canthal tilt'),ep('eyeT',EYE_TILT),L('Upper-eyelid exposure (UEE)'),ep('eyeU',EYE_UEE),
   L('Head shape'),pick('head',Object.keys(HEADS),v=>[H(headSvg(v)),v]),
   L('Hair color'),pick('hairC',Object.keys(HAIRC),v=>[E('i',{style:'background:'+HAIRC[v]}),v]),
   L('Hair thickness (single strand)'),pick('hairT',['Fine','Medium','Coarse'],v=>[v]),
   L('Hair type'),pick('hairY',Object.keys(HAIR),v=>[H(hairSvg(v)),v]),
   L('Skin type'),pick('skinT',Object.keys(SKIN),v=>[H(skinSvg(v)),v,E('small',{},SKIN[v])])),
  err,go)}

async function saveProfile(p){S.p=p;LS.s('astra_p_'+S.uid,p);if(!S.db)return note('Saved on this device only (sign in to sync).');
 try{await S.db.collection('data/users/'+S.uid).doc('profile').set(p);const c=S.db.collection('codes').doc(p.code),s=await c.get();
  if(s.exists&&s.data().uid!==S.uid){p.code=genCode();return saveProfile(p)}await c.set({uid:S.uid,name:p.nick})}
 catch(e){note('Saved on this device only: '+(e.message||e.code))}}

function nav(on){const n=$('#nav');n.replaceChildren();if(!on)return;
 [['home','Home'],['msg','Messages'],['me','Profile']].forEach(([k,t])=>n.append(E('button',{class:S.view===k||(k==='me'&&S.view==='edit')?'on':'',onclick:()=>{S.view=k;render()}},t)))}

function render(){const v=$('#v');v.replaceChildren();document.documentElement.dataset.g=S.p?.gender||'';
 $('#area').textContent=S.p?(S.p.gender==='male'?'Male area':'Female area'):'';
 if(!S.ready){v.append(E('p',{class:'mu'},'Loading…'));nav(0);return}
 if(!S.p){v.append(form());nav(0);return}
 nav(1);({home,msg,me,edit:v=>v.append(form(1))}[S.view]||home)(v)}

const kv=(a,b)=>E('div',{class:'kv'},E('span',{},a),E('span',{},b||'—'));
function home(v){const p=S.p;
 const tabs=E('div',{class:'tabs'},[['body','Body'],['face','Face'],['spirit','Spirit']].map(([k,t])=>E('button',{class:S.tab===k?'on':'',onclick:()=>{S.tab=k;render()}},t)));
 const sw=c=>E('span',{class:'sw',style:'background:'+c});
 let c;
 if(S.tab==='body')c=[kv('Age',p.age),kv('Height',p.height&&p.height+' cm'),kv('Weight',p.weight&&p.weight+' kg'),kv('Shoe size',p.shoe&&'EU '+p.shoe)];
 else if(S.tab==='face')c=[kv('Head shape',p.head),kv('Eye shape',p.eyeS),kv('Eye depth',p.eyeD),kv('Canthal tilt',p.eyeT),kv('UEE',p.eyeU),kv('Eye color',p.eyeC),kv('Skin type',p.skinT),kv('Skin tone',sw(p.skinHex||'#ccc')),kv('Hair',[p.hairC,p.hairT,p.hairY].filter(Boolean).join(' · '))];
 else c=[E('p',{class:'mu'},'Spirit tools are coming soon.')];
 v.append(E('h2',{},'Welcome, '+p.nick),tabs,E('div',{class:'card'},c),E('p',{class:'mu'},'More sections will be added here later.'))}

function me(v){const p=S.p;
 v.append(E('h2',{},'Profile'),E('div',{class:'card'},E('div',{class:'mu',style:'text-align:center'},'Your friend code'),E('div',{class:'code'},p.code),
  E('button',{class:'btn s',style:'display:block;margin:0 auto',onclick:()=>{try{navigator.clipboard.writeText(p.code);note('Copied')}catch(e){note(p.code)}}},'Copy code')),
  E('div',{class:'card'},kv('Nickname',p.nick),kv('Area',p.gender==='male'?'Male':'Female'),kv('Race / ethnicity',p.race)),
  E('button',{class:'btn',onclick:()=>{S.view='edit';render()}},'Edit details'))}

function convo(){const t={};[...S.m.in,...S.m.out].forEach(m=>{const o=m.from===S.uid?m.to:m.from;(t[o]??=[]).push(m)});Object.values(t).forEach(a=>a.sort((x,y)=>x.ts-y.ts));return t}
function people(){const t=convo(),map={};S.fr.forEach(f=>map[f.uid]=f);
 Object.keys(t).forEach(u=>{if(!map[u]){const m=t[u].find(x=>x.from===u);if(m)map[u]={uid:u,name:m.fn||'Someone',code:m.fc||''}}});return Object.values(map)}

async function addFriend(code){code=code.trim().toUpperCase();if(!code)return;
 if(!S.db)return note('Messages need a signed-in view.');
 if(code===S.p.code)return note('That’s your own code.');
 try{const s=await S.db.collection('codes').doc(code).get();if(!s.exists)return note('No one has that code.');
  const d=s.data();if(S.fr.some(f=>f.uid===d.uid))return note('Already added.');
  S.fr=[...S.fr,{uid:d.uid,code,name:d.name}];await S.db.collection('data/users/'+S.uid).doc('friends').set({list:S.fr});
  S.chat=d.uid;refreshMsg();note('Added '+d.name)}catch(e){note('Couldn’t add: '+(e.message||e.code))}}

function msg(v){const add=E('input',{placeholder:'Friend code',maxlength:6,style:'text-transform:uppercase'});
 v.append(E('h2',{},'Messages'),E('div',{class:'card'},E('b',{},'Add a friend'),E('div',{class:'row'},add,E('button',{class:'btn s',onclick:()=>addFriend(add.value)},'Add'))),
  E('div',{class:'card',id:'flist'}),E('div',{class:'card',id:'thread'}));refreshMsg()}

function refreshMsg(){const fl=$('#flist'),th=$('#thread');if(!fl||!th)return;
 const old=$('#cin'),val=old?old.value:'',foc=old&&document.activeElement===old;
 const ps=people(),t=convo();fl.replaceChildren();
 if(!ps.length)fl.append(E('p',{class:'mu'},'No friends yet. Share your code from the Profile tab or add one above.'));
 ps.forEach(f=>fl.append(E('button',{class:'fr'+(S.chat===f.uid?' on':''),onclick:()=>{S.chat=f.uid;refreshMsg()}},f.name+(f.code?'  ·  '+f.code:''))));
 th.replaceChildren();if(!S.chat){th.append(E('p',{class:'mu'},'Pick a friend to chat.'));return}
 (t[S.chat]||[]).forEach(m=>th.append(E('div',{class:'bub'+(m.from===S.uid?' me':'')},m.text)));
 const i=E('input',{id:'cin',placeholder:'Message…',maxlength:500});i.value=val;
 const go=()=>{const x=i.value.trim();if(x){i.value='';send(x)}};i.onkeydown=e=>{if(e.key==='Enter')go()};
 th.append(E('div',{class:'row'},i,E('button',{class:'btn s',onclick:go},'Send')));if(foc)i.focus()}

 try{await S.db.collection('msgs').add({from:S.uid,to:S.chat,text,ts:Date.now(),fn:S.p.nick,fc:S.p.code})}catch(e){note('Couldn’t send: '+(e.message||e.code))}}

  q.where('to','==',S.uid).onSnapshot(up('in'),()=>{});q.where('from','==',S.uid).onSnapshot(up('out'),()=>{})}catch(e){}}
